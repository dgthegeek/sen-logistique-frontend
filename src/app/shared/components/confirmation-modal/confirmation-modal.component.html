<div
  *ngIf="showModal"
  class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[9999] animate-fadeIn"
  (click)="onCancel()"
>
  <div
    class="card max-w-md w-full animate-scaleIn"
    (click)="$event.stopPropagation()"
  >
    <!-- Icon -->
    <div class="flex justify-center mb-4">
      <div
        class="w-16 h-16 rounded-full flex items-center justify-center text-3xl"
        [ngClass]="getIconClass()"
      >
        {{ getIcon() }}
      </div>
    </div>

    <!-- Title -->
    <h2 class="text-2xl font-bold text-foreground text-center mb-3">
      {{ config?.title }}
    </h2>

    <!-- Message -->
    <p class="text-muted-foreground text-center mb-6">
      {{ config?.message }}
    </p>

    <!-- Buttons -->
    <div class="flex gap-3">
      <button
        (click)="onCancel()"
        class="btn-outline flex-1"
      >
        {{ config?.cancelText }}
      </button>
      <button
        (click)="onConfirm()"
        class="flex-1"
        [ngClass]="getConfirmButtonClass()"
      >
        {{ config?.confirmText }}
      </button>
    </div>
  </div>
</div>
