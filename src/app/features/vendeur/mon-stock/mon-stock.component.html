<div class="min-h-screen bg-background">
  <app-header></app-header>

  <div class="flex">
    <app-sidebar></app-sidebar>

    <main class="flex-1 min-w-0 p-4 sm:p-6">
      <div class="max-w-5xl mx-auto">
        <div class="mb-6">
          <h1 class="text-2xl sm:text-3xl font-bold text-foreground mb-1">
            <i class="fa-solid fa-warehouse"></i> Mon stock
          </h1>
          <p class="text-sm text-muted-foreground">Vos produits stockés chez Dioks.</p>
        </div>

        <div *ngIf="loading" class="card text-center py-10 text-muted-foreground">
          <i class="fa-solid fa-spinner fa-spin"></i> Chargement...
        </div>

        <div *ngIf="!loading && produits.length === 0" class="card text-center py-10 text-muted-foreground">
          <i class="fa-solid fa-box-open text-2xl mb-2"></i>
          <p>Aucun produit en stock pour le moment.</p>
        </div>

        <div *ngIf="!loading && produits.length > 0" class="card overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left text-muted-foreground border-b border-border">
                <th class="p-2">Code</th>
                <th class="p-2">Produit</th>
                <th class="p-2 text-center">Stock</th>
                <th class="p-2 text-right">Prix</th>
                <th class="p-2 text-center">Statut</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let p of produits" class="border-b border-border/50">
                <td class="p-2 font-mono">{{ p.code }}</td>
                <td class="p-2 font-medium text-foreground">{{ p.nom }}</td>
                <td class="p-2 text-center">
                  <span class="font-semibold" [class.text-red-600]="p.enAlerte">{{ p.quantiteStock }}</span>
                  <span *ngIf="p.enAlerte" class="badge badge-failed ml-1">Stock faible</span>
                </td>
                <td class="p-2 text-right">{{ p.prixUnitaire ? (p.prixUnitaire | fcfa) : '—' }}</td>
                <td class="p-2 text-center">
                  <span class="badge" [ngClass]="p.actif ? 'badge-delivered' : 'badge-canceled'">
                    {{ p.actif ? 'Actif' : 'Inactif' }}
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
