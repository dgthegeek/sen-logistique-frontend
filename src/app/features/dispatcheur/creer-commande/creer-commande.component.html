<div class="min-h-screen bg-background">
  <app-header></app-header>

  <div class="flex">
    <app-sidebar></app-sidebar>

    <main class="flex-1 min-w-0 p-4 sm:p-6">
      <div class="max-w-3xl mx-auto">

        <div class="mb-6">
          <h1 class="text-2xl sm:text-3xl font-bold text-foreground mb-2">
            <i class="fa-solid fa-circle-plus"></i> Créer une commande
          </h1>
          <p class="text-sm text-muted-foreground">
            Pour le compte d'un vendeur (identifié par son téléphone).
          </p>
        </div>

        <!-- Résultat -->
        <div *ngIf="cree" class="card mb-4 border-l-4 border-emerald-500">
          <h2 class="text-lg font-bold text-foreground mb-1">
            <i class="fa-solid fa-circle-check text-emerald-500"></i> Commande créée
          </h2>
          <p class="text-sm text-muted-foreground mb-1">
            N° de tracking : <span class="font-mono text-foreground">{{ cree.numeroTracking }}</span>
          </p>
          <p class="text-sm text-muted-foreground mb-3">
            Frais de livraison : <strong>{{ cree.fraisLivraison | fcfa }}</strong> —
            Montant COD : <strong>{{ cree.montantCOD | fcfa }}</strong>
          </p>
          <button class="btn-primary" (click)="nouvelle()">
            <i class="fa-solid fa-plus"></i> Créer une autre commande
          </button>
        </div>

        <!-- Formulaire -->
        <form *ngIf="!cree" class="card space-y-4" (ngSubmit)="soumettre()">

          <div>
            <label class="block text-sm font-medium text-foreground mb-1">Téléphone du vendeur *</label>
            <input class="form-input w-full" [(ngModel)]="form.telephoneVendeur" name="telephoneVendeur"
                   placeholder="Ex : 771234567" required>
          </div>

          <hr class="border-border">

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-foreground mb-1">Nom du client *</label>
              <input class="form-input w-full" [(ngModel)]="form.nomClient" name="nomClient" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-foreground mb-1">Téléphone client *</label>
              <input class="form-input w-full" [(ngModel)]="form.telephoneClient" name="telephoneClient"
                     placeholder="Ex : 772345678" required>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-foreground mb-1">Adresse complète *</label>
            <input class="form-input w-full" [(ngModel)]="form.adresseComplete" name="adresseComplete"
                   placeholder="Quartier, rue, villa..." required>
          </div>

          <div>
            <label class="block text-sm font-medium text-foreground mb-1">Point de repère</label>
            <input class="form-input w-full" [(ngModel)]="form.pointRepere" name="pointRepere"
                   placeholder="Ex : face à la mosquée">
          </div>

          <div>
            <label class="block text-sm font-medium text-foreground mb-1">Description du produit *</label>
            <input class="form-input w-full" [(ngModel)]="form.descriptionProduit" name="descriptionProduit"
                   placeholder="Ex : Ensemble wax" required>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-foreground mb-1">Montant COD (FCFA) *</label>
              <input type="number" class="form-input w-full" [(ngModel)]="form.montantCOD" name="montantCOD"
                     min="0" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-foreground mb-1">Urgence</label>
              <select class="form-input w-full" [(ngModel)]="form.urgence" name="urgence">
                <option value="NORMAL">Normal</option>
                <option value="EXPRESS">Express</option>
              </select>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <input type="checkbox" id="fragile" [(ngModel)]="form.fragile" name="fragile">
            <label for="fragile" class="text-sm text-foreground">Colis fragile</label>
          </div>

          <div>
            <label class="block text-sm font-medium text-foreground mb-1">Notes pour le livreur</label>
            <textarea class="form-input w-full" rows="2" [(ngModel)]="form.notesPourLivreur" name="notesPourLivreur"
                      placeholder="Ex : appeler avant d'arriver"></textarea>
          </div>

          <div class="flex justify-end">
            <button type="submit" class="btn-primary" [disabled]="loading">
              <i class="fa-solid" [ngClass]="loading ? 'fa-spinner fa-spin' : 'fa-check'"></i>
              Créer la commande
            </button>
          </div>
        </form>

      </div>
    </main>
  </div>
</div>
