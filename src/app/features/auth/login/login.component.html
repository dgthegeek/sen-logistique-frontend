<app-auth-header [linkUrl]="'/register'" [linkText]="'Créer un compte'"></app-auth-header>

<div class="min-h-[calc(100vh-4rem)] bg-gradient-to-br from-primary/5 via-background to-primary/10 flex items-center justify-center p-4">
  <div class="card max-w-md w-full">
    <div class="text-center mb-6">
      <img src="assets/icons/icon-512.png" alt="Dioks" class="w-16 h-16 rounded-2xl mx-auto mb-4">
      <h1 class="text-3xl font-bold text-foreground mb-2">Connexion</h1>
      <p class="text-muted-foreground">Accédez à votre espace Dioks</p>
    </div>

    <!-- Message d'erreur -->
    <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 text-red-800 rounded-lg text-sm">
      <div class="flex items-start gap-2">
        <i class="fa-solid fa-circle-exclamation flex-shrink-0 mt-0.5"></i>
        <span>{{ errorMessage }}</span>
      </div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Téléphone -->
      <div class="mb-4">
        <label for="telephone" class="form-label">
          <i class="fa-solid fa-phone mr-2"></i>Numéro de téléphone *
        </label>
        <div class="relative">
          <input
            id="telephone"
            type="tel"
            formControlName="telephone"
            class="form-input pl-10"
            [class.border-destructive]="telephone?.invalid && telephone?.touched"
            placeholder="Ex : 771234567"
          />
          <i class="fa-solid fa-mobile-screen-button absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground"></i>
        </div>
        <p *ngIf="telephone?.invalid && telephone?.touched" class="form-error">
          <i class="fa-solid fa-triangle-exclamation mr-1"></i>Numéro invalide (au moins 9 chiffres)
        </p>
      </div>

      <!-- Mot de passe -->
      <div class="mb-6">
        <label for="password" class="form-label">
          <i class="fa-solid fa-lock mr-2"></i>Mot de passe *
        </label>
        <div class="relative">
          <input
            id="password"
            type="password"
            formControlName="password"
            class="form-input pl-10"
            [class.border-destructive]="password?.invalid && password?.touched"
            placeholder="••••••••"
          />
          <i class="fa-solid fa-key absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground"></i>
        </div>
        <p *ngIf="password?.invalid && password?.touched" class="form-error">
          <i class="fa-solid fa-triangle-exclamation mr-1"></i>Le mot de passe doit contenir au moins 6 caractères
        </p>
      </div>

      <!-- Bouton Submit -->
      <button
        type="submit"
        class="btn-primary w-full py-3"
        [disabled]="loading || loginForm.invalid"
      >
        <i *ngIf="!loading" class="fa-solid fa-right-to-bracket mr-2"></i>
        <i *ngIf="loading" class="fa-solid fa-spinner fa-spin mr-2"></i>
        <span *ngIf="!loading">Se connecter</span>
        <span *ngIf="loading">Connexion en cours...</span>
      </button>
    </form>

    <!-- Divider -->
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t"></div>
      </div>
      <div class="relative flex justify-center text-sm">
        <span class="px-2 bg-card text-muted-foreground">Pas encore de compte ?</span>
      </div>
    </div>

    <!-- Lien inscription -->
    <a routerLink="/register" class="btn-outline w-full text-center block py-3">
      <i class="fa-solid fa-user-plus mr-2"></i>Créer un compte gratuitement
    </a>
  </div>
</div>
