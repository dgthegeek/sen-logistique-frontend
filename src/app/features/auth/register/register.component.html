<app-auth-header [linkUrl]="'/login'" [linkText]="'Se connecter'"></app-auth-header>

<div class="min-h-[calc(100vh-4rem)] bg-gradient-to-br from-primary/5 via-background to-primary/10 py-12 px-4">
  <div class="max-w-2xl mx-auto">
    
    <!-- Header Section -->
    <div class="text-center mb-8">
      <i class="fa-solid fa-user-plus text-5xl text-primary mb-4"></i>
      <h1 class="text-3xl md:text-4xl font-bold text-foreground mb-3">
        Créer un compte
      </h1>
      <p class="text-lg text-muted-foreground">
        Rejoignez Dioks et commencez à gérer vos livraisons
      </p>
    </div>

    <!-- Form Card -->
    <div class="card">
      <!-- Progress Bar -->
      <div class="mb-8">
        <div class="flex justify-between mb-3">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold transition-colors"
                 [class.bg-primary]="currentStep >= 1"
                 [class.text-white]="currentStep >= 1"
                 [class.bg-muted]="currentStep < 1">
              1
            </div>
            <span class="text-sm font-medium" [class.text-primary]="currentStep >= 1">
              <i class="fa-solid fa-user mr-1"></i>Informations
            </span>
          </div>
          <div class="flex-1 flex items-center mx-2">
            <div class="h-1 w-full rounded-full" [class.bg-primary]="currentStep >= 2" [class.bg-muted]="currentStep < 2"></div>
          </div>
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold transition-colors"
                 [class.bg-primary]="currentStep >= 2"
                 [class.text-white]="currentStep >= 2"
                 [class.bg-muted]="currentStep < 2">
              2
            </div>
            <span class="text-sm font-medium" [class.text-primary]="currentStep >= 2">
              <i class="fa-solid fa-store mr-1"></i>Boutique
            </span>
          </div>
          <div class="flex-1 flex items-center mx-2">
            <div class="h-1 w-full rounded-full" [class.bg-primary]="currentStep >= 3" [class.bg-muted]="currentStep < 3"></div>
          </div>
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold transition-colors"
                 [class.bg-primary]="currentStep >= 3"
                 [class.text-white]="currentStep >= 3"
                 [class.bg-muted]="currentStep < 3">
              3
            </div>
            <span class="text-sm font-medium" [class.text-primary]="currentStep >= 3">
              <i class="fa-solid fa-location-dot mr-1"></i>Adresse
            </span>
          </div>
        </div>
      </div>

      <!-- Message d'erreur -->
      <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border border-red-200 text-red-800 rounded-lg text-sm">
        <div class="flex items-start gap-2">
          <i class="fa-solid fa-circle-exclamation flex-shrink-0 mt-0.5"></i>
          <span>{{ errorMessage }}</span>
        </div>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <!-- ÉTAPE 1: Informations personnelles -->
        <div *ngIf="currentStep === 1" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="form-label">
                <i class="fa-solid fa-user mr-1"></i>Prénom *
              </label>
              <input formControlName="prenom" type="text" class="form-input" placeholder="Fatou" />
            </div>
            <div>
              <label class="form-label">
                <i class="fa-solid fa-user mr-1"></i>Nom *
              </label>
              <input formControlName="nom" type="text" class="form-input" placeholder="Diop" />
            </div>
          </div>

          <div>
            <label class="form-label">
              <i class="fa-solid fa-phone mr-1"></i>Téléphone *
            </label>
            <input formControlName="telephone" type="tel" class="form-input" placeholder="77 123 45 67" />
            <p *ngIf="registerForm.get('telephone')?.invalid && registerForm.get('telephone')?.touched" class="form-error">
              <i class="fa-solid fa-triangle-exclamation mr-1"></i>Format invalide (ex: 77 123 45 67)
            </p>
          </div>

          <div>
            <label class="form-label">
              <i class="fa-solid fa-envelope mr-1"></i>Email (optionnel)
            </label>
            <input formControlName="email" type="email" class="form-input" placeholder="fatou&#64;example.com" />
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="form-label">
                <i class="fa-solid fa-lock mr-1"></i>Mot de passe *
              </label>
              <input formControlName="password" type="password" class="form-input" placeholder="••••••••" />
            </div>
            <div>
              <label class="form-label">
                <i class="fa-solid fa-lock mr-1"></i>Confirmer *
              </label>
              <input formControlName="confirmPassword" type="password" class="form-input" placeholder="••••••••" />
              <p *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched" class="form-error">
                <i class="fa-solid fa-triangle-exclamation mr-1"></i>Les mots de passe ne correspondent pas
              </p>
            </div>
          </div>
        </div>

        <!-- ÉTAPE 2: Boutique -->
        <div *ngIf="currentStep === 2" class="space-y-4">
          <div>
            <label class="form-label">
              <i class="fa-solid fa-store mr-1"></i>Nom de la boutique
            </label>
            <input formControlName="nomBoutique" type="text" class="form-input" placeholder="Fatou Fashion" />
          </div>

          <div>
            <label class="form-label">
              <i class="fa-solid fa-tags mr-1"></i>Catégorie d'activité
            </label>
            <select formControlName="categorieActivite" class="form-select">
              <option value="">Sélectionner une catégorie</option>
              <option value="Mode">Mode & Vêtements</option>
              <option value="Cosmétiques">Cosmétiques & Beauté</option>
              <option value="Électronique">Électronique</option>
              <option value="Accessoires">Accessoires</option>
              <option value="Alimentation">Alimentation</option>
              <option value="Autre">Autre</option>
            </select>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="form-label">
                <i class="fa-brands fa-instagram mr-1"></i>Instagram
              </label>
              <div class="relative">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground">&#64;</span>
                <input formControlName="instagram" type="text" class="form-input pl-8" placeholder="fatoufashion" />
              </div>
            </div>
            <div>
              <label class="form-label">
                <i class="fa-brands fa-facebook mr-1"></i>Facebook
              </label>
              <input formControlName="facebook" type="text" class="form-input" placeholder="Fatou Fashion" />
            </div>
          </div>
        </div>

        <!-- ÉTAPE 3: Adresse -->
        <div *ngIf="currentStep === 3" class="space-y-4">
          <div>
            <label class="form-label">
              <i class="fa-solid fa-city mr-1"></i>Commune *
            </label>
            <select formControlName="commune" class="form-select">
              <option value="">Sélectionner une commune</option>
              <option *ngFor="let commune of communes" [value]="commune">{{ commune }}</option>
            </select>
          </div>

          <div>
            <label class="form-label">
              <i class="fa-solid fa-map-pin mr-1"></i>Quartier *
            </label>
            <select formControlName="quartier" class="form-select" [disabled]="!registerForm.get('commune')?.value">
              <option value="">Sélectionner un quartier</option>
              <option *ngFor="let quartier of filteredQuartiers" [value]="quartier.nom">{{ quartier.nom }}</option>
            </select>
          </div>

          <div>
            <label class="form-label">
              <i class="fa-solid fa-location-dot mr-1"></i>Adresse complète *
            </label>
            <textarea formControlName="adresseComplete" class="form-textarea" rows="3" placeholder="Villa 123, Rue SC-45..."></textarea>
          </div>

          <div>
            <label class="form-label">
              <i class="fa-solid fa-landmark mr-1"></i>Point de repère
            </label>
            <input formControlName="pointRepere" type="text" class="form-input" placeholder="Près de la station Total..." />
          </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex justify-between mt-8 pt-6 border-t">
          <button
            type="button"
            class="btn-outline px-6"
            (click)="previousStep()"
            *ngIf="currentStep > 1"
          >
            <i class="fa-solid fa-arrow-left mr-2"></i>Précédent
          </button>

          <button
            type="button"
            class="btn-primary px-8 ml-auto"
            (click)="nextStep()"
            *ngIf="currentStep < 3"
          >
            Suivant<i class="fa-solid fa-arrow-right ml-2"></i>
          </button>

          <button
            type="submit"
            class="btn-primary px-8 py-3 ml-auto"
            *ngIf="currentStep === 3"
            [disabled]="loading || registerForm.invalid"
          >
            <i *ngIf="!loading" class="fa-solid fa-user-plus mr-2"></i>
            <i *ngIf="loading" class="fa-solid fa-spinner fa-spin mr-2"></i>
            <span *ngIf="!loading">Créer mon compte</span>
            <span *ngIf="loading">Création...</span>
          </button>
        </div>
      </form>

      <!-- Footer -->
      <div class="mt-6 pt-6 border-t text-center">
        <p class="text-sm text-muted-foreground">
          Déjà inscrit ?
          <a routerLink="/login" class="text-primary hover:underline font-medium">
            <i class="fa-solid fa-right-to-bracket mr-1"></i>Se connecter
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
