name: CD - Deploy Frontend to Production

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: sen-logistique-frontend
  DOCKER_IMAGE_TAG: ${{ github.sha }}
  DEPLOY_PATH: /home/deploy/sen-logistique-frontend

jobs:
  
  # ==========================================
  # JOB 1 : Build Frontend
  # ==========================================
  build:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
          outputs: type=docker,dest=/tmp/frontend-image.tar
      
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: /tmp/frontend-image.tar
          retention-days: 1

  # ==========================================
  # JOB 2 : Deploy Frontend
  # ==========================================
  deploy:
    name: Deploy Frontend to Server
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
      
      - name: Copy Docker image to server
        run: |
          scp /tmp/frontend-image.tar deploy@${{ secrets.SERVER_IP }}:/tmp/sen-frontend-image.tar
      
      - name: Copy configuration files
        run: |
          ssh deploy@${{ secrets.SERVER_IP }} "mkdir -p ${{ env.DEPLOY_PATH }}"
          scp docker-compose.prod.yml deploy@${{ secrets.SERVER_IP }}:${{ env.DEPLOY_PATH }}/
          scp nginx.conf deploy@${{ secrets.SERVER_IP }}:${{ env.DEPLOY_PATH }}/
          scp -r scripts/ deploy@${{ secrets.SERVER_IP }}:${{ env.DEPLOY_PATH }}/
      
      - name: Load and deploy
        run: |
          ssh deploy@${{ secrets.SERVER_IP }} << 'EOF'
            # Charger l'image
            docker load -i /tmp/sen-frontend-image.tar
            docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }} ${{ env.DOCKER_IMAGE_NAME }}:latest
            rm /tmp/sen-frontend-image.tar
            
            # Créer le réseau partagé s'il n'existe pas
            docker network create sen-network || true
            
            # Déployer
            cd ${{ env.DEPLOY_PATH }}
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
          EOF
      
      - name: Health Check
        run: |
          ssh deploy@${{ secrets.SERVER_IP }} << 'EOF'
            sleep 5
            
            # Tester que le frontend répond
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4200)
            
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ Frontend ne répond pas (HTTP $HTTP_CODE)"
              exit 1
            fi
            
            echo "✅ Frontend déployé avec succès!"
          EOF
      
      - name: Clean up
        run: |
          ssh deploy@${{ secrets.SERVER_IP }} << 'EOF'
            docker image prune -a -f --filter "until=72h"
          EOF

  # ==========================================
  # JOB 3 : Notification
  # ==========================================
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    steps:
      - name: Deployment Success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Frontend déployé sur http://${{ secrets.SERVER_IP }}:4200"
          echo "🎉 Version: ${{ env.DOCKER_IMAGE_TAG }}"

      - name: Deployment Failed
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Déploiement frontend échoué!"